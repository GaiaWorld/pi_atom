[package]
name = "pi_atom"
version = "0.7.0"
authors = ["zmythleo <zmythleo@gmail.com>"]
edition = "2021"
description = "The global thread safe atomic string pool reduces the memory occupation of the same string and is also used for HashMap keys"
repository = "https://github.com/GaiaWorld/pi_atom"
license = "MIT OR Apache-2.0"
keywords = ["pi",  "atom"]


[dependencies]
papaya = { version = "0.2.5", optional = true }
rapidhash = "4.5"
fory = "1.7.7"
smol_str = "0.3.6"
pi_share = { version = "2.0", path = "../pi_share" }

[dev-dependencies]
getrandom = "0.2"

[dependencies.serde]
version = "1.0"
features = ["serde_derive"]
default-features = true
optional = true

[features]
default = ["dep:papaya"]
rc = ["pi_share/rc"]
pointer_width_32 = []
lookup_by_hash = []
serde = ["dep:serde", "smol_str/serde"]
